<!DOCTYPE html><html lang="uz" style=""><head>

                    "secondary-fixed": "#d8e2ff",
                    "on-primary-container": "#cad3ff",
                    "surface-container-low": "#eff4ff",
                    "on-surface": "#0b1c30",
                    "on-secondary-container": "#fefcff",
                    "surface": "#f8f9ff",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#eaf1ff",
                    "inverse-surface": "#213145",
                    "background": "#f8f9ff",
                    "primary-fixed": "#dce1ff",
                    "error": "#ba1a1a",
                    "surface-container-highest": "#d3e4fe",
                    "on-primary-fixed": "#001551",
                    "surface-tint": "#2151da",
                    "outline": "#747686",
                    "on-tertiary-fixed": "#390c00",
                    "inverse-primary": "#b7c4ff",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed-variant": "#0039b5",
                    "on-error": "#ffffff",
                    "tertiary": "#7f2500",
                    "on-secondary-fixed-variant": "#004395",
                    "surface-container": "#e5eeff",
                    "secondary-container": "#2170e4",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#832700",
                    "surface-variant": "#d3e4fe",
                    "surface-bright": "#f8f9ff",
                    "secondary": "#0058be",
                    "on-secondary-fixed": "#001a42",
                    "on-tertiary-container": "#ffc9b7",
                    "tertiary-fixed": "#ffdbcf",
                    "tertiary-container": "#a73400",
                    "secondary-fixed-dim": "#adc6ff",
                    "primary-container": "#1d4ed8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "inline-gap": "12px",
                    "container-padding": "20px",
                    "stack-gap": "16px",
                    "section-margin": "32px"
            },
            "fontFamily": {
                    "label-caps": ["Inter"],
                    "h1": ["Inter"],
                    "h2": ["Inter"],
                    "status-badge": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "h1": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "h2": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "status-badge": ["13px", {"lineHeight": "18px", "fontWeight": "600"}],

                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f8f9ff;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .login-gradient {
            background: radial-gradient(circle at top right, #e5eeff 0%, #f8f9ff 50%);
        }
    </style>
</head>
<body class="login-gradient min-h-screen flex flex-col justify-center items-center px-container-padding overflow-hidden">
<!-- Atmospheric WebGL-like Shader Background (subtle) -->
<div class="fixed inset-0 -z-10 opacity-30 pointer-events-none">
<!-- Using a placeholder for the animated shader if one were requested, but here we use a CSS equivalent for stability -->
<div class="absolute top-0 right-0 w-96 h-96 bg-primary/5 rounded-full blur-[100px] animate-pulse"></div>
<div class="absolute bottom-0 left-0 w-64 h-64 bg-secondary/5 rounded-full blur-[80px] animate-pulse" style="animation-delay: 2s;"></div>
</div>
<!-- Main Login Container -->
<main class="w-full max-w-[420px] z-10">
<!-- Logo & Branding Section -->
<div class="flex flex-col items-center mb-section-margin text-center">
<div class="w-20 h-20 mb-6 bg-primary rounded-2xl flex items-center justify-center shadow-lg transform rotate-3 hover:rotate-0 transition-transform duration-500">
<span class="material-symbols-outlined text-on-primary text-5xl" style="font-variation-settings: 'FILL' 1;">cleaning_services</span>
</div>
<h1 class="font-h1 text-h1 text-on-background mb-2">GoHotel Service</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                Mehmonxona xizmati boshqaruv tizimiga xush kelibsiz
            </p>
</div>
<!-- Form Card -->
<div class="glass-card p-8 rounded-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] animate-in fade-in slide-in-from-bottom-4 duration-700">
<form class="flex flex-col gap-stack-gap" id="loginForm">
<!-- Identifier Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="identifier">
                        TELEFON RAQAMI YOKI XODIM ID
                    </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline/50" id="identifier" placeholder="Masalan: +998 90 123 45 67" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">
                            PAROL
                        </label>
<a class="font-label-caps text-[11px] text-primary hover:underline" href="#">PAROLNI UNUTDINGIZMI?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-[56px] pl-12 pr-12 bg-surface border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline/50" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Toggle -->
<div class="flex items-center gap-2 mt-2">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox">
<label class="font-body-md text-body-md text-on-surface-variant select-none" for="remember">Eslab qolish</label>
</div>
<!-- Submit Button -->
<button class="h-[56px] mt-4 bg-primary text-on-primary rounded-xl font-h2 text-h2 hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-md shadow-primary/20" type="submit">
                    Kirish
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Language Switcher (Optional Detail) -->
<div class="mt-8 pt-6 border-t border-outline-variant/30 flex justify-center gap-6">
<button class="font-label-caps text-label-caps text-primary">O'ZBEK</button>
<button class="font-label-caps text-label-caps text-outline hover:text-on-surface-variant transition-colors">РУССКИЙ</button>
<button class="font-label-caps text-label-caps text-outline hover:text-on-surface-variant transition-colors">ENGLISH</button>
</div>
</div>
<!-- Support Info -->
<p class="mt-12 text-center font-body-md text-body-md text-outline">
            Muammo yuzaga kelsa, ma'muriyatga murojaat qiling. <br>
<span class="font-medium text-on-surface-variant">Qo'llab-quvvatlash: +998 71 200 00 00</span>
</p>
</main>
<!-- Success Modal (Hidden by default) -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-background/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300" id="successModal">
<div class="bg-surface p-8 rounded-[32px] shadow-2xl flex flex-col items-center max-w-xs text-center border border-primary/10">
<div class="w-16 h-16 bg-secondary-container rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-h2 text-h2 text-on-background mb-2">Muvaffaqiyatli!</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Tizimga kirish tasdiqlandi. Yo'naltirilmoqda...</p>
</div>
</div>
<script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.innerText = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const modal = document.getElementById('successModal');
            
            // Interaction logic
            submitBtn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span> Yuklanmoqda...';
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100');
                
                // Simulate redirect
                setTimeout(() => {
                    alert('Home screen is the next destination!');
                }, 1500);
            }, 1000);
        });

        // Add a micro-interaction for the background
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const gradient = document.querySelector('.login-gradient');
            gradient.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, #e5eeff 0%, #f8f9ff 60%)`;
        });
    </script>
</body></html>
