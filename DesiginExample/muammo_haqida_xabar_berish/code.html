<body class="min-h-screen text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background shadow-sm sticky top-0 z-50 flex justify-between items-center w-full px-container-padding py-4">
<div class="flex items-center gap-3">

</div>
<div class="flex items-center">

</div>
</header>
<main class="px-container-padding py-6 max-w-2xl mx-auto pb-32">

<div class="z-10">

<p class="font-body-md text-on-surface-variant max-w-[200px]">Xona yoki uskunalar bilan bog'liq muammoni tavsiflang.</p>
</div>
<div class="absolute right-0 top-0 h-full w-1/2 opacity-20 pointer-events-none">
<div class="w-full h-full bg-cover bg-center" data-alt="A clean, minimalist 5-star hotel room interior with soft morning light, emphasizing high-end hospitality and professional maintenance. The aesthetic is bright, airy, and organized, using a palette of white, light blue, and grey to convey cleanliness and efficiency. The lighting is natural and sophisticated." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBK1QwilM19vujYL4H2VTcqw6rKWr0uNY8QdRN0pBH8_p6I1GWd6KVfIeJSJag9gQ_FiNMJGhcOAMYEPo-ppzGuaInNuFVvYrmn8mcKH4b8ZRgWQvf5YfseCGMcIGCaoI5oGu414_WSFvHcyHnrlhTOW6fQjGf8bHePfPFxiMuHVOy93y5BuTT-5hjlVE5zulI7QqyhE-qC3HvCcCPzJ7uiubmAV8_2J3g9fKzbE_WlMVXXE1EKyhHxMw')"></div>
</div>
</div>
<!-- Form Section -->
<form class="space-y-stack-gap">
<!-- Category Selection -->
<div class="space-y-2">

<div class="grid grid-cols-2 gap-3">
<button class="category-btn flex flex-col items-center justify-center p-4 bg-surface-container-lowest border border-outline-variant rounded-xl hover:bg-surface-container-high transition-all active:scale-95 group border-primary bg-surface-container" type="button">
<span class="material-symbols-outlined text-primary mb-2 group-hover:scale-110 transition-transform">broken_image</span>
<span class="font-body-md text-on-surface">Siniq buyum</span>
</button>
<button class="category-btn flex flex-col items-center justify-center p-4 bg-surface-container-lowest border border-outline-variant rounded-xl hover:bg-surface-container-high transition-all active:scale-95 group" type="button">
<span class="material-symbols-outlined text-on-surface-variant mb-2 group-hover:scale-110 transition-transform">engineering</span>
<span class="font-body-md text-on-surface">Texnik nosozlik</span>
</button>
<button class="category-btn flex flex-col items-center justify-center p-4 bg-surface-container-lowest border border-outline-variant rounded-xl hover:bg-surface-container-high transition-all active:scale-95 group" type="button">
<span class="material-symbols-outlined text-on-surface-variant mb-2 group-hover:scale-110 transition-transform">water_drop</span>
<span class="font-body-md text-on-surface">Suv sizishi</span>
</button>
<button class="category-btn flex flex-col items-center justify-center p-4 bg-surface-container-lowest border border-outline-variant rounded-xl hover:bg-surface-container-high transition-all active:scale-95 group" type="button">
<span class="material-symbols-outlined text-on-surface-variant mb-2 group-hover:scale-110 transition-transform">more_horiz</span>
<span class="font-body-md text-on-surface">Boshqa</span>
</button>
</div>
</div>
<!-- Comment Section -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="comment">IZOH</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-4 font-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 outline-none transition-all resize-none" id="comment" placeholder="Muammoning tafsilotlarini kiriting..." rows="4"></textarea>
</div>
<!-- Photo Upload Section -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1">RASM YUKLASH</label>
<div class="flex gap-3">
<button class="flex flex-col items-center justify-center w-24 h-24 bg-surface-container-lowest border-2 border-dashed border-outline-variant rounded-xl hover:bg-surface-container-high transition-colors group" type="button">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary">add_a_photo</span>
</button>
<!-- Placeholder for uploaded images -->
<div class="relative w-24 h-24 rounded-xl overflow-hidden shadow-sm group">

<button class="absolute top-1 right-1 bg-error text-on-error rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
<p class="font-body-md text-[12px] text-on-surface-variant opacity-70 mt-1">Kamida bitta rasm ilova qiling (Max 3 ta).</p>
</div>
</form>
<!-- Submit Action -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-surface/80 backdrop-blur-md">
<button class="w-full h-[56px] bg-primary text-on-primary font-body-lg rounded-full flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
                Xabar yuborish
            </button>
</div>
</main>
<!-- Bottom Navigation Shell (Invisible as per Relevance Check, but structured if needed) -->
<!-- Suppressed for transactional screen focus -->
<script>
        // Micro-interaction for category selection
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active classes from all
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.classList.remove('border-primary', 'bg-surface-container');
                    const icon = b.querySelector('.material-symbols-outlined');
                    if(icon) icon.classList.remove('text-primary');
                    if(icon) icon.classList.add('text-on-surface-variant');
                });
                
                // Add active classes to selected
                this.classList.add('border-primary', 'bg-surface-container');
                const activeIcon = this.querySelector('.material-symbols-outlined');
                if(activeIcon) {
                    activeIcon.classList.remove('text-on-surface-variant');
                    activeIcon.classList.add('text-primary');
                }
            });
        });

        // Simple form validation visual cue
        const submitBtn = document.querySelector('button.bg-primary');
        submitBtn.addEventListener('click', () => {
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Yuborilmoqda...';
            setTimeout(() => {
                submitBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Muvaffaqiyatli!';
                submitBtn.classList.remove('bg-primary');
                submitBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
                
                setTimeout(() => {
                    window.history.back();
                }, 1000);
            }, 1500);
        });
    </script>
</body></html>
